# ==============================================================================
# Hostinger VPS Nginx Configuration for R Sports & Cafe
# Location on Ubuntu: /etc/nginx/sites-available/rsportscafe
# Symlink: sudo ln -s /etc/nginx/sites-available/rsportscafe /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com; # Replace with your real domain or VPS IP

    # Enable Gzip compression for high performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # 1. Main Cafe Frontend (React Vite Build)
    root /var/www/cafe/dist;
    index index.html;

    # Static assets long-term caching
    location ~* \.(webp|png|jpe?g|gif|ico|svg|mp4|webm|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # React Client-side routing (Prevents 404 on page refresh like /menu, /turf, /book-table)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Admin Dashboard (if hosted at /admin path)
    location /admin {
        alias /var/www/cafe-admin/dist;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # 3. Node.js Express API Backend Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for upload operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 4. Uploaded files proxy (if local uploads are served)
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Security: deny access to hidden files (.git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
