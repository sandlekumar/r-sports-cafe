version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:latest
    container_name: cafe_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - cafe_network

  # Backend Express Server
  server:
    build:
      context: ./cafe/server
      dockerfile: Dockerfile
    container_name: cafe_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/r-sports-cafe?retryWrites=false
      - CLIENT_URL=http://localhost
    volumes:
      - server_uploads:/app/uploads
    depends_on:
      - mongo
    networks:
      - cafe_network

  # Main Frontend Website (Vite + Nginx)
  cafe:
    build:
      context: ./cafe
      dockerfile: Dockerfile
    container_name: cafe_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - cafe_network

  # Admin Dashboard (Vite + Nginx)
  cafe-admin:
    build:
      context: ./cafe-admin
      dockerfile: Dockerfile
    container_name: cafe_admin
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - server
    networks:
      - cafe_network

networks:
  cafe_network:
    driver: bridge

volumes:
  mongo_data:
  server_uploads:
